name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark to run'
        required: false
        default: 'simple'
        type: choice
        options:
          - all
          - diagnose
          - minimal
          - simple
          - batch
          - transform-model
          - transform-memory
          - memory-rate
          - poc-simple
          - poc-extended
          - poc-all
          - poc-comparison-simple
          - poc-comparison-extended
          - poc-actor-steady
          - poc-actor-rotation
          - poc-actor-memory
          - poc-actor-all
          - poc-epoch-production-io
          - poc-epoch-all
          - poc-batch-comparison

env:
  DOTNET_VERSION: '8.0.x'
  BENCHMARK_PROJECT: 'src/Benchmarks/Benchmarks.csproj'
  POC_BENCHMARK_PROJECT: 'poc/DataFlow.Benchmarks/DataFlow.Benchmarks.csproj'
  RESULTS_DIR: 'docs/benchmarks'
  POC_RESULTS_DIR: 'poc/DataFlow.Benchmarks/benchmark-results'

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib pandas
    
    - name: Install dotnet-counters
      run: dotnet tool install -g dotnet-counters
    
    - name: Restore dependencies
      run: |
        dotnet restore ${{ env.BENCHMARK_PROJECT }}
        dotnet restore ${{ env.POC_BENCHMARK_PROJECT }}
    
    - name: Build benchmark project
      run: dotnet build ${{ env.BENCHMARK_PROJECT }} --configuration Release --no-restore
    
    - name: Create results directory
      run: mkdir -p ${{ env.RESULTS_DIR }}
    
    - name: Run benchmarks
      run: |
        chmod +x .github/scripts/run-benchmarks.sh
        .github/scripts/run-benchmarks.sh \
          "${{ github.event.inputs.benchmark }}" \
          "${{ env.BENCHMARK_PROJECT }}" \
          "${{ env.POC_BENCHMARK_PROJECT }}" \
          "${{ env.RESULTS_DIR }}" \
          "${{ env.POC_RESULTS_DIR }}"
    
    - name: Upload benchmark results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: |
          ${{ env.RESULTS_DIR }}/*.txt
          ${{ env.POC_RESULTS_DIR }}/*.md
          ${{ env.POC_RESULTS_DIR }}/*.png
          ${{ env.POC_RESULTS_DIR }}/*.csv
          ${{ env.POC_RESULTS_DIR }}/charts_*/**
          BenchmarkDotNet.Artifacts/results/*.md
          BenchmarkDotNet.Artifacts/results/*.csv
          BenchmarkDotNet.Artifacts/results/*.html
          poc/DataFlow.Benchmarks/BenchmarkDotNet.Artifacts/results/*.md
          poc/DataFlow.Benchmarks/BenchmarkDotNet.Artifacts/results/*.csv
          poc/DataFlow.Benchmarks/BenchmarkDotNet.Artifacts/results/*.html
        retention-days: 90
        if-no-files-found: warn
    
    - name: Commit benchmark results
      id: commit
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        COMMITTED=false
        
        # Add non-POC benchmark results if they exist
        if [ -n "$(ls -A ${{ env.RESULTS_DIR }}/*.txt 2>/dev/null)" ]; then
          git add ${{ env.RESULTS_DIR }}/*.txt
          COMMITTED=true
        fi
        
        # Add POC benchmark results if they exist (respecting .gitignore)
        if [ -n "$(ls -A ${{ env.POC_RESULTS_DIR }}/*.md 2>/dev/null)" ]; then
          git add -f ${{ env.POC_RESULTS_DIR }}/*.md
          COMMITTED=true
        fi
        
        # Add POC comparison visualizations and summary files
        if find "${{ env.POC_RESULTS_DIR }}" -type d -name "charts_*" -print -quit 2>/dev/null | grep -q .; then
          git add -f ${{ env.POC_RESULTS_DIR }}/charts_*/*.png 2>/dev/null || true
          git add -f ${{ env.POC_RESULTS_DIR }}/charts_*/*.md 2>/dev/null || true
          COMMITTED=true
        fi
        
        # Add BenchmarkDotNet artifacts from root directory (created by POC benchmarks)
        if [ -n "$(ls -A BenchmarkDotNet.Artifacts/results/*.md 2>/dev/null)" ]; then
          git add -f BenchmarkDotNet.Artifacts/results/*.md
          COMMITTED=true
        fi
        if [ -n "$(ls -A BenchmarkDotNet.Artifacts/results/*.csv 2>/dev/null)" ]; then
          git add -f BenchmarkDotNet.Artifacts/results/*.csv
          COMMITTED=true
        fi
        if [ -n "$(ls -A BenchmarkDotNet.Artifacts/results/*.html 2>/dev/null)" ]; then
          git add -f BenchmarkDotNet.Artifacts/results/*.html
          COMMITTED=true
        fi
        
        if [ "$COMMITTED" = true ]; then
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Add benchmark results from ${{ github.event.inputs.benchmark }} run"
            echo "committed=true" >> $GITHUB_OUTPUT
          fi
        else
          echo "No benchmark result files found to commit"
          echo "committed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Push benchmark results
      if: steps.commit.outputs.committed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
