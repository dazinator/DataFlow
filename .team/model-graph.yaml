# Prompt System Dependency Graph
# Version: 1.5 (Issue #391 - Unlabeled Work Items Support)
# Created: 2025-11-12
# Updated: 2025-11-12 (Issue #391: Added query_unlabeled_work_items semantic operation)
# Maintained by: Process Modeling Workflow
#
# This file documents the dependency graph of the prompt/workflow system.
# It serves as the baseline for the layered architecture migration.
#
# Node Types:
#   - orchestration: Entry point (copilot-instructions.md)
#   - workflow: ARCHIVED - Old workflow files (replaced by duties)
#   - duty: New duty-based system (active)
#   - procedure: Global procedures layer (platform-agnostic, duty-independent)
#   - kernel: Kernel layer (platform abstraction)
#   - supporting-doc: Supporting documentation referenced by workflows
#   - system-doc: System-level documentation
#
# Edge Types:
#   - required: Must be loaded before proceeding
#   - optional: Useful to reference, may not be needed
#   - cross-reference: Informational link
#
# Phase 1 Complete:
#   - Kernel layer structure created
#   - GitHub driver implemented with 12 semantic operations
#   - Graph tooling scripts created
#   - Leak detection implemented
#   - Kernel test suite established
#
# Phase 2 Complete:
#   - Global procedures layer created
#   - 6 core procedures implemented (duty-assignment, multi-phase, self-improvement, 
#     work-item-creation, handover, comment-patterns)
#   - All procedures use semantic operations only (zero platform-specific code)
#   - Test scenario structure created
#   - Graph updated with procedure nodes and dependencies
#
# Phase 3 Complete:
#   - All 7 duties migrated from legacy workflow files
#   - Duties use semantic operations exclusively
#   - Duty test scenarios created
#   - Graph updated with duty nodes and dependencies
#
# Phase 4 Complete:
#   - Orchestration updated to layered architecture
#   - Required Context section added (imports kernel, procedures)
#   - Duty assignment and dispatch logic implemented
#   - All references updated from "workflow" to "duty"
#   - Graph updated with orchestration layer dependencies
#
# Phase 5 Complete:
#   - Old workflow files archived to .github/archive/workflows/
#   - All references to workflow files updated
#   - Backward compatibility removed
#   - Full regression testing completed
#   - System validated and ready for production
#
# Post-Phase 5 Updates:
#   - Issue #391: Added query_unlabeled_work_items semantic operation (13th operation)
#   - Updated Triage Duty bulk triage procedure to handle unlabeled work items
#   - Kernel now has 13 semantic operations (was 12)

