# Prompt System Dependency Graph
# Version: 1.2 (Phase 2 - Global Procedures Added)
# Created: 2025-11-12
# Updated: 2025-11-12 (Added global procedures layer nodes and edges)
# Maintained by: Process Modeling Workflow
#
# This file documents the dependency graph of the prompt/workflow system.
# It serves as the baseline for the layered architecture migration.
#
# Node Types:
#   - orchestration: Entry point (copilot-instructions.md)
#   - workflow: Current workflow files (will become "duty" in migration)
#   - procedure: Global procedures layer (platform-agnostic, duty-independent) - Phase 2
#   - kernel: Kernel layer (platform abstraction) - Phase 1
#   - supporting-doc: Supporting documentation referenced by workflows
#   - system-doc: System-level documentation
#
# Edge Types:
#   - required: Must be loaded before proceeding
#   - optional: Useful to reference, may not be needed
#   - cross-reference: Informational link
#
# Phase 1 Complete:
#   - Kernel layer structure created
#   - GitHub driver implemented with 12 semantic operations
#   - Graph tooling scripts created
#   - Leak detection implemented
#   - Kernel test suite established
#
# Phase 2 Complete:
#   - Global procedures layer created
#   - 6 core procedures implemented (duty-assignment, multi-phase, self-improvement, 
#     work-item-creation, handover, comment-patterns)
#   - All procedures use semantic operations only (zero platform-specific code)
#   - Test scenario structure created
#   - Graph updated with procedure nodes and dependencies

nodes:
